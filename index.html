<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1F4BC9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Morley Moms">
  <title>Morley Moms</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-components.css">
</head>
<body>
  <div id="app"><div class="boot fall" role="status" aria-label="Loading Morley Moms">
    <div class="boot-center"><span class="logo-mark boot-logo" aria-hidden="true">M</span><p class="boot-title">Morley Moms</p><p class="boot-msg" id="bootMsg" aria-hidden="true">Raking the leaves…</p></div>
  </div></div>
  <script>
    (function () {
      // Seasonal splash. Each phone sees it for its first 3 opens of a theme (it is only counted once it has
      // fully played, so a background refresh can't use it up). Bump SPLASH_ID for a new theme, or add ?splash to preview.
      var SPLASH_ID = 'fall-2026', HOLD_MS = 2600, SHOWS = 3;
      // People who ask their phone for less motion get a much shorter splash (and no falling leaves; see styles.css).
      try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) HOLD_MS = 800; } catch (e) {}
      var KEY = 'mm.splash', n = 0;
      try { var raw = (localStorage.getItem(KEY) || '').split(':'); if (raw[0] === SPLASH_ID) n = parseInt(raw[1], 10) || 0; } catch (e) {}
      var force = /[?&]splash\b/.test(location.search);
      if (n < SHOWS || force) {
        window.__bootHold = new Promise(function (resolve) {
          function start() {
            setTimeout(function () {
              try { localStorage.setItem(KEY, SPLASH_ID + ':' + (n + 1)); } catch (e) {}
              resolve();
            }, HOLD_MS);
          }
          if (document.visibilityState === 'visible') start();
          else document.addEventListener('visibilitychange', function f() { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', f); start(); } });
        });
      }
      var boot = document.querySelector('.boot'); if (!boot) return;
      var leaves = ['🍂', '🍁', '🍂', '🍁', '🍃', '🌰', '🎃', '🍂', '🍁', '🍂', '🦃', '🍁'];
      leaves.forEach(function (ch, n) {
        var s = document.createElement('span'); s.className = 'leaf'; s.setAttribute('aria-hidden', 'true'); s.textContent = ch;
        s.style.left = (4 + (n * 8.1) % 92) + '%';
        s.style.animationDuration = (5 + (n * 7) % 5) + 's';
        s.style.animationDelay = (-(n * 1.3) % 7) + 's';
        s.style.fontSize = (22 + (n * 5) % 16) + 'px';
        boot.appendChild(s);
      });
      var msgs = ['Raking the leaves…', 'Gathering acorns…', 'Warming up the cocoa…', 'Stuffing the turkey…', 'Jumping in the leaf pile…', 'Carving the pumpkins…', 'Packing backpacks…', 'Counting the days…'];
      var i = 0, el = document.getElementById('bootMsg'); if (!el) return;
      el.textContent = msgs[i];
      var t = setInterval(function () {
        var m = document.getElementById('bootMsg'); if (!m) { clearInterval(t); return; }
        i = (i + 1) % msgs.length; m.textContent = msgs[i];
      }, 1200);
    })();
  </script>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="demo-calendar.js"></script>
  <script src="quickadd.js"></script>
  <script src="app.js"></script>
</body>
</html>
