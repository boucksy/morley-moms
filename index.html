<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1F4BC9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Morley Moms">
  <title>Morley Moms</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="boot">
    <span class="boot-float f1">✏️</span><span class="boot-float f2">📚</span><span class="boot-float f3">🍎</span>
    <span class="boot-float f4">⭐</span><span class="boot-float f5">🎒</span><span class="boot-float f6">🖍️</span>
    <div class="boot-center"><span class="logo-mark boot-logo">M</span><p class="boot-title">Morley Moms</p><p class="boot-msg" id="bootMsg">Sharpening pencils…</p></div>
  </div></div>
  <script>
    (function () {
      var msgs = ['Sharpening pencils…', 'Packing backpacks…', 'Counting the days…', 'Finding the book fair…', 'Checking the lunch line…', 'Hunting for lost mittens…', 'Alphabetizing spelling words…'];
      var i = Math.floor(Math.random() * msgs.length);
      var el = document.getElementById('bootMsg'); if (!el) return;
      el.textContent = msgs[i];
      var t = setInterval(function () {
        var m = document.getElementById('bootMsg'); if (!m) { clearInterval(t); return; }
        i = (i + 1) % msgs.length; m.textContent = msgs[i];
      }, 1300);
    })();
  </script>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="demo-calendar.js"></script>
  <script src="quickadd.js"></script>
  <script src="app.js"></script>
</body>
</html>
