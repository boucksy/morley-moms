name: Function logs (one-off)
on: workflow_dispatch
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets and functions
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          R: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sS -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects/$R/secrets" | python3 -c "import sys,json; d=json.load(sys.stdin); print([x.get('name') for x in d] if isinstance(d,list) else d)"
          curl -sS -H "Authorization: Bearer $T" "https://api.supabase.com/v1/projects/$R/functions" | python3 -c "import sys,json; d=json.load(sys.stdin); print([(x['slug'],x['version'],x['status']) for x in d] if isinstance(d,list) else d)"
