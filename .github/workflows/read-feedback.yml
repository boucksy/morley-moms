name: Read feedback (one-off)
on: workflow_dispatch
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -c "select policyname, cmd, roles, with_check, qual from pg_policies where tablename='feedback';"
          psql "$DB" -c "select grantee, privilege_type from information_schema.role_table_grants where table_name='feedback';"
          psql "$DB" -c "\d public.feedback"
          psql "$DB" -c "select pg_get_functiondef('public.is_member'::regproc);"
          psql "$DB" -c "select count(*) members from public.members;"
