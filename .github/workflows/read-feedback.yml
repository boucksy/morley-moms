name: Read feedback (one-off)
on: workflow_dispatch
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate a mom sending feedback
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB" -v ON_ERROR_STOP=0 <<'SQL'
          select count(*) as members from public.members;
          begin;
          select set_config('request.jwt.claims', json_build_object('sub', gen_random_uuid()::text, 'email', (select email from public.members where not coalesce(is_admin,false) limit 1), 'role','authenticated')::text, true);
          set local role authenticated;
          select public.is_member() as is_member_now;
          insert into public.feedback (kind, message, member_name, app_version, user_agent) values ('idea','test','Test',106,'ua');
          rollback;
          SQL
